<!DOCTYPE html>
<html>
<head>
    <title>Form URL</title>
</head>
<body>

<h2>Form URL</h2>

<fieldset>
    <legend>URL</legend>

    <form>
        URL:
        <input type="url" placeholder="Masukkan URL">
        <br><br>

        Tanggal:
        <input type="date">
        <br><br>

        Waktu:
        <input type="time">
        <br><br>

        Jumlah:
        <input type="number">
        <br><br>

        <button type="submit">Send</button>
        <button type="reset">Reset</button>
    </form>
</fieldset>

</body>
</html>
