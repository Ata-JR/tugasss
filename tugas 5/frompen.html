<!DOCTYPE html>
<html>
<head>
    <title>Form Pendaftaran</title>
</head>
<body>

<h2>Form Pendaftaran</h2>

<fieldset>
    <legend>Pendaftaran Siswa</legend>

    <form>
        Nama Lengkap:
        <input type="text">
        <br><br>

        NIS:
        <input type="text">
        <br><br>

        Jenis Kelamin:
        <input type="radio" name="gender"> Laki-laki
        <input type="radio" name="gender"> Perempuan
        <br><br>

        Tanggal Lahir:
        <input type="date">
        <br><br>

        Jurusan:
        <select>
            <option>Pilih Jurusan</option>
            <option>PPLG</option>
            <option>TJKT</option>
            <option>DKV</option>
        </select>
        <br><br>

        Alamat:
        <br>
        <textarea rows="3" cols="30"></textarea>
        <br><br>

        Foto:
        <input type="file">
        <br><br>

        <input type="checkbox">
        Saya menyetujui data yang dimasukkan
        <br><br>

        <button type="submit">Daftar</button>
        <button type="reset">Reset</button>
    </form>
</fieldset>

</body>
</html>
